name: Deploy coupon scraper Worker
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-coupon-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: coupon-worker-production
    steps:
      - name: Verify and resolve release commit
        id: revision
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              ...context.repo, branch: "main"
            });
            const current = data.commit.sha;
            const requested = context.eventName === "workflow_dispatch"
              ? current : context.payload.workflow_run.head_sha;
            if (current !== requested) {
              core.notice("Skipping obsolete Worker release " + requested);
              core.setOutput("ready", "false");
              return;
            }
            core.setOutput("ready", "true");
            core.setOutput("sha", requested);
      - name: Check Cloudflare deployment credential
        if: steps.revision.outputs.ready == 'true'
        id: credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if test -n "$CLOUDFLARE_API_TOKEN"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment blocked: CLOUDFLARE_API_TOKEN is not configured for this environment.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Cloudflare deployment credential is missing; no migration or deployment occurred.'
            exit 1
          fi
      - uses: actions/checkout@v4
        if: steps.credential.outputs.ready == 'true'
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.credential.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: coupon-scraper/package-lock.json
      - name: Install and verify the Worker source
        if: steps.credential.outputs.ready == 'true'
        run: |
          npm ci --prefix coupon-scraper
          npm run predeploy --prefix coupon-scraper
          npm run build --prefix coupon-scraper
      - name: Apply additive D1 schema
        if: steps.credential.outputs.ready == 'true'
        working-directory: coupon-scraper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate
      - name: Deploy tested Worker bundle
        if: steps.credential.outputs.ready == 'true'
        working-directory: coupon-scraper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Verify deployed health, evidence and source endpoints
        if: steps.credential.outputs.ready == 'true'
        run: node scripts/check-scraper-health.mjs
