name: Promotion feed health
on:
  workflow_dispatch:
  schedule:
    - cron: '55 5,17 * * *'
permissions:
  contents: read
concurrency:
  group: promotion-feed-health
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/audit-promotion-feed.mjs
      - name: Keep provenance and freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-health
          path: feed-health/
          retention-days: 14
