name: Promotion feed health
on:
  workflow_dispatch:
  schedule:
    - cron: "55 5,17 * * *"
permissions:
  contents: read
concurrency:
  group: promotion-feed-health
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:feed
      - name: Keep provenance and freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-health
          path: feed-health/
          retention-days: 14
