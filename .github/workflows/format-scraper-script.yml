name: Format new scraper monitor
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-scraper-script.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.19.0
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --write scripts/check-scraper-health.mjs
      - name: Commit only formatting changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add scripts/check-scraper-health.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format coupon scraper health checker"
          gh auth setup-git
          git push origin HEAD:main
