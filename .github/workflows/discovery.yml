name: Discover promotions
on:
  schedule:
    # Every six hours, away from the start-of-hour queue.
    - cron: "17 4,10,16,22 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-discovery
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: discovery
    permissions:
      contents: write
    env:
      PROMOTION_FEED: local
      DATA_DIR: .data/discovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Load last published feed
        run: pnpm exec tsx scripts/load-promotion-feed.ts
      - name: Check official sources and use the optional free fallback
        env:
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
          CJ_WEBSITE_ID: ${{ vars.CJ_WEBSITE_ID }}
          CJ_ADVERTISERS: ${{ vars.CJ_ADVERTISERS }}
        run: pnpm discover --publish
      - name: Publish the public promotion feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/publish-promotion-feed.ts
      - name: Clean up optional private report storage
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/cleanup-promotion-data.ts
