name: Discover promotions
on:
  schedule:
    # UTC+2: 06:17 each morning in South Africa.
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-discovery
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: discovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Search all stores and update shared promotion data
        env:
          SEARCH_PROVIDER: tavily
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACTION_MODEL: ${{ vars.EXTRACTION_MODEL || 'gpt-4.1-mini' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RATE_LIMIT_SECRET: ${{ secrets.RATE_LIMIT_SECRET }}
        run: pnpm discover
