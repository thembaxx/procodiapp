name: Verify free Gemini page discovery
on:
  workflow_dispatch:
    inputs:
      source:
        description: Verification request
        required: false
        default: manual
        type: choice
        options: [manual]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: discovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.19.0
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify production Gemini discovery against public sources
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCOVERY_SEARCH_MODE: brave
        run: node --conditions=react-server --import tsx scripts/verify-gemini-page-discovery.mjs
