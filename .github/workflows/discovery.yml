name: Diagnose Gemini access
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Diagnostic request"
        required: false
        default: manual
        type: choice
        options:
          - manual
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: discovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check basic generation and grounded search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/diagnose-gemini-access.mjs
