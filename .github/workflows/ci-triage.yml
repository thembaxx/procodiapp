name: CI failure triage
on:
  workflow_run:
    workflows: ["Discover promotions", "Deploy production", "Promotion feed health"]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  triage:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository }}
    uses: thembaxx/thembaxx/.github/workflows/ci-triage-reusable.yml@main
    with:
      run_id: ${{ github.event.workflow_run.id }}
      workflow_name: ${{ github.event.workflow_run.name }}
