name: Scraper health failure triage
on:
  workflow_run:
    workflows: ["Coupon scraper operational health"]
    types: [completed]
permissions:
  actions: read
  issues: write
jobs:
  classify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: thembaxx/thembaxx/.github/workflows/failure-triage-reusable.yml@main
