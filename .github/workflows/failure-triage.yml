name: CI failure triage
on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
permissions:
  actions: read
  issues: write
jobs:
  classify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: thembaxx/thembaxx/.github/workflows/failure-triage-reusable.yml@5c97694bb12373a005e5edc7f5e0de0bae165018
