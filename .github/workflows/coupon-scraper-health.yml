name: Coupon scraper operational health
on:
  push:
    branches: [main]
    paths:
      - scripts/check-scraper-health.mjs
      - .github/workflows/coupon-scraper-health.yml
  schedule:
    - cron: "25 5,17 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coupon-scraper-health
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-scraper-health.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-health
          path: reports/scraper-health.json
          if-no-files-found: warn
          retention-days: 14
