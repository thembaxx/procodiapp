name: Bug report
description: Report a reproducible app problem without credentials or personal data.
title: "Bug: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Explain the expected and actual behavior. Use test data only.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone, installed app or browser tab
